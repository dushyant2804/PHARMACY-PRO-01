name: Backend report regression tests

on:
  push:
    branches:
      - fix/dashboard-reports-2026-10
  pull_request:
    branches:
      - main
    paths:
      - "server.py"
      - "local_database.py"
      - "tests/test_reports_intelligence.py"
      - "requirements.txt"

jobs:
  report-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run report regression tests
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: test_pharmacy
        run: python -m unittest tests.test_reports_intelligence
